<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Actu Info</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f4f6f8;color:#1a1a2e;line-height:1.7}
header{background:#1a1a2e;color:#fff;padding:20px 30px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{font-size:22px}
header p{color:#aaa;font-size:13px}
nav{background:#4f46e5;padding:0 30px;display:flex;flex-wrap:wrap}
nav a{color:#fff;padding:14px 18px;text-decoration:none;font-weight:600;font-size:14px}
nav a:hover{background:rgba(255,255,255,.15)}
main{max-width:700px;margin:30px auto;padding:0 20px}
.box{background:#fff;padding:40px;border-radius:12px}
h1.titre{font-size:28px;margin-bottom:8px}
p.intro{color:#666;margin-bottom:24px}
label{display:block;margin-bottom:16px}
label span{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input,textarea{width:100%;padding:12px 14px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;font-family:inherit}
textarea{min-height:140px;resize:vertical}
button{background:#4f46e5;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-weight:700;cursor:pointer;font-size:15px}
button:hover{background:#4338ca}
footer{text-align:center;padding:30px;color:#888;font-size:14px;margin-top:40px;background:#fff;border-top:1px solid #e2e8f0}
footer a{color:#4f46e5;margin:0 10px;text-decoration:none}
</style>
</head>
<body>
<header><div><h1>Actu Info</h1><p>Le blog des nouvelles technologies</p></div></header>
<nav>
  <a href="index.html">Accueil</a>
  <a href="securite.html">Sécurité</a>
  <a href="windows.html">Windows</a>
  <a href="linux.html">Linux</a>
  <a href="ia.html">IA</a>
  <a href="contact.html">Contact</a>
</nav>
<main>
  <div class="box">
    <h1 class="titre">Contact</h1>
    <p class="intro">Une question, une suggestion ? Écrivez-nous.</p>
    <form onsubmit="alert('Message envoyé !'); return false;">
      <label><span>Votre nom</span><input type="text" required></label>
      <label><span>Votre email</span><input type="email" required></label>
      <label><span>Votre message</span><textarea required></textarea></label>
      <button type="submit">Envoyer</button>
    </form>
  </div>
</main>
<footer>© 2026 Actu Info — <a href="index.html">Accueil</a></footer>
</body>
</html>
